services:
  identity:
    build:
      context: .
      dockerfile: src/Services/Identity/Vat.Identity.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__IdentityDatabase: "${VAT_IDENTITY_DATABASE_CONNECTION:?Set VAT_IDENTITY_DATABASE_CONNECTION}"
      Authentication__Authority: "${VAT_OIDC_AUTHORITY:?Set VAT_OIDC_AUTHORITY}"
      Authentication__Audience: "${VAT_OIDC_AUDIENCE:-vat-api}"
      Messaging__Enabled: "false"
    ports:
      - "127.0.0.1:5101:8080"
    restart: unless-stopped
